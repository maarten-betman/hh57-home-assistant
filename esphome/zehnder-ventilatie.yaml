substitutions:
  name: zehnder-ventilatie
  friendly_name: Ventilatie

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: arduino

logger:
  # TEMPORARY: VERBOSE so we can see nRF905 register verify + raw RF frames while pairing.
  # Set back to DEBUG (and drop `logs:`) once pairing works.
  level: VERBOSE
  logs:
    api: DEBUG
    api.connection: DEBUG
    api.service: DEBUG
    wifi: DEBUG
    scheduler: DEBUG
    component: DEBUG
    sensor: DEBUG
    esp32.preferences: DEBUG
    captive_portal: DEBUG
    mdns: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"

captive_portal:

external_components:
  # Local port of github://Sanderhuisman/ESPHome-Zehnder-RF for ESPHome 2026.x (see PATCHES.md)
  - source:
      type: local
      path: components_src/ESPHome-Zehnder-RF/components

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

nrf905:
  id: nrf905_rf
  cs_pin: GPIO23
  cd_pin: GPIO33
  ce_pin: GPIO27
  pwr_pin: GPIO26
  txen_pin: GPIO25

fan:
  - platform: zehnder
    id: zehnder_fan
    name: "Ventilatie"
    nrf905: nrf905_rf
    update_interval: 60s

button:
  - platform: restart
    name: "Herstart ventilatie-bridge"

sensor:
  - platform: wifi_signal
    name: "WiFi signaal"
    update_interval: 60s
